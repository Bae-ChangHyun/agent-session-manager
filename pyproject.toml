[project]
name = "agent-session-manager"
version = "0.10.1"
description = "Manage Claude Code & Codex sessions, cost, and data from your terminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "bch", email = "bch@users.noreply.github.com"},
]
keywords = ["claude", "claude-code", "codex", "openai", "terminal", "session-manager", "textual", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "textual>=1.0.0",
    "send2trash>=1.8.0",
    "claude-agent-sdk>=0.1.40",
]

[project.urls]
Homepage = "https://github.com/Bae-ChangHyun/agent-session-manager"
Repository = "https://github.com/Bae-ChangHyun/agent-session-manager"
Issues = "https://github.com/Bae-ChangHyun/agent-session-manager/issues"

[project.scripts]
asm = "asm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asm"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/", "*.cast", "fonts/"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
