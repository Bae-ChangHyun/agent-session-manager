[project]
name = "cc-tui"
version = "0.1.0"
description = "Terminal UI for managing Claude Code sessions, projects, and data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "send2trash>=1.8.0",
    "claude-agent-sdk>=0.1.40",
]

[project.scripts]
cc-tui = "cc_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_tui"]
