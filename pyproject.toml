[project]
name = "cc-session-utils"
version = "0.2.0"
description = "Terminal UI for managing Claude Code sessions, projects, and data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "bch", email = "bch@users.noreply.github.com"},
]
keywords = ["claude", "claude-code", "tui", "terminal", "session-manager", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "textual>=1.0.0",
    "send2trash>=1.8.0",
    "claude-agent-sdk>=0.1.40",
]

[project.urls]
Homepage = "https://github.com/Bae-ChangHyun/cc-session-utils"
Repository = "https://github.com/Bae-ChangHyun/cc-session-utils"
Issues = "https://github.com/Bae-ChangHyun/cc-session-utils/issues"

[project.scripts]
cc-tui = "cc_tui.__main__:main"
cc-session-utils = "cc_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_tui"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/", "*.cast", "fonts/"]
